name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hassfest:
    uses: "home-assistant/actions/.github/workflows/hassfest.yml@master"

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: "hacs/action@main"
        with:
          category: "integration"
          ignore: "brands"
